spring.application.name=agroverde-spa

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@fullstack_high?TNS_ADMIN=Wallet_fullstack
spring.datasource.username=nico_connect
spring.datasource.password=FullStack-001

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# cambiamos de "create-drop" a "update" para que los datos no se borren al reiniciar la app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.java.sql=DEBUG